<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Corilo</title><link rel="stylesheet" href="/login.css">
<main><h1>Corilo 可里</h1><p>你的资料，随时找回，也能带走。</p><form id="login">
<label>邮箱<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
<label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
<label>邀请码（首次使用）<input name="invitation" autocomplete="off" maxlength="64"></label>
<button>登录</button><p id="error" role="alert"></p></form><small>目前仅限受邀用户。使用已验证的账号登录；笔记保存在服务端，支持知识库导出。</small></main><script src="/login.js"></script></html>
