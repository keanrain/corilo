name: Corilo Harness personal todos plugin
on:
  push:
    paths:
      - 'plugins/todos/**'
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - 'package.json'
      - 'scripts/**'
      - 'launcher/**'
      - 'deploy/**'
      - '.github/workflows/todos-plugin.yml'
  pull_request:
    paths:
      - 'plugins/todos/**'
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - 'package.json'
      - 'scripts/**'
      - 'launcher/**'
      - 'deploy/**'
      - '.github/workflows/todos-plugin.yml'
permissions:
  contents: read
jobs:
  todos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure npm cache
        run: echo "npm_config_cache=$RUNNER_TEMP/corilo-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/todos/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugins/todos
      - run: npm ci --ignore-scripts
        working-directory: plugins/notes
      - run: npm --prefix plugins/notes run build
      - run: npm run test:todos
      - run: npm run test:startup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix plugins/todos run test:browser
