name: Corilo app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check browser adapter syntax
        run: |
          node --check app/web/adapter.js
          node --check app/web/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: python app/tests/browser_smoke.py
      - run: python app/tests/browser_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corilo-browser-result
          path: |
            .local/corilo-browser-result.json
            .local/corilo-browser.png
          if-no-files-found: warn
