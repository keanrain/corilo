name: Corilo Harness notes plugin
on:
  push:
    paths:
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - '.github/workflows/notes-plugin.yml'
  pull_request:
    paths:
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - '.github/workflows/notes-plugin.yml'
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORILO_REQUIRE_RESTIC: '1'
    steps:
      - name: Configure npm cache
        run: echo "npm_config_cache=$RUNNER_TEMP/corilo-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/notes/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugins/notes
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: restic version
      - run: npm run test:notes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix plugins/notes run test:browser
