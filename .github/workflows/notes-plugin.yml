name: Corilo Harness notes plugin
on:
  push:
    paths:
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - '.github/workflows/notes-plugin.yml'
  pull_request:
    paths:
      - 'plugins/notes/**'
      - 'requirements-dev.txt'
      - '.github/workflows/notes-plugin.yml'
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      npm_config_cache: ${{ runner.temp }}/corilo-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/notes/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugins/notes
      - run: npm run test:notes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix plugins/notes run test:browser
