name: Cloud file service checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: corilo_test
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corilo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORILO_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/corilo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:cloud
      - name: Build isolated Pi worker
        run: |
          docker build -f app/cloud/worker/Dockerfile -t corilo-worker:test .
          echo "CORILO_TEST_WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' corilo-worker:test)" >> "$GITHUB_ENV"
      - run: npm run test:worker
