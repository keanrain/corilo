name: Publish package prerelease

on:
  push:
    tags:
      - 'packages-*'
  pull_request:
    paths:
      - '.github/workflows/publish-packages.yml'
      - 'scripts/assemble-package-release.mjs'
      - 'scripts/test/assemble-package-release.test.mjs'

permissions:
  contents: read

concurrency:
  group: package-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm run check:dsh
      - run: npm run test:tooling

  packages:
    if: startsWith(github.ref, 'refs/tags/packages-')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        product: [notes, todos, learn-anything]
    env:
      RELEASE_PRODUCT: ${{ matrix.product }}
      RELEASE_TAG: ${{ github.ref_name }}
      CORILO_REQUIRE_RESTIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        run: |
          [[ "$RELEASE_TAG" =~ ^packages-[0-9]{8}(\.[0-9]+)?$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Install selected package dependencies
        run: |
          case "$RELEASE_PRODUCT" in
            notes|todos) release_package_dir="plugins/$RELEASE_PRODUCT" ;;
            learn-anything) release_package_dir="packages/learn-anything" ;;
            *) exit 1 ;;
          esac
          npm ci --prefix "$release_package_dir" --ignore-scripts
      - name: Install real backup test dependency
        if: matrix.product == 'notes'
        run: sudo apt-get update && sudo apt-get install -y restic
      - name: Build, test, and validate archive
        run: npm run prepare:release -- "$RELEASE_PRODUCT" --output "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/packages-')
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/prepared
          pattern: '*'
      - name: Assemble public assets and provenance
        run: node scripts/assemble-package-release.mjs "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - name: Create draft and upload validated assets
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Corilo packages ${RELEASE_TAG#packages-}" --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"*
      - name: Verify uploaded bytes before publishing
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          sha256sum -c SHA256SUMS
      - name: Publish prerelease
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
