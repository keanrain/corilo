<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="xuye-session" content="__SESSION__">
  <title>续页 · 本地原型</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar" aria-label="本地笔记">
      <a class="brand" href="#" id="brand"><span class="brand-mark">续</span><span>续页<small>XUYE</small></span></a>
      <button class="nav active" id="home-button"><span>↗</span> 随手记</button>
      <div class="section-heading"><span>本地笔记</span><button id="new-note" title="新建笔记" aria-label="新建笔记">＋</button></div>
      <label class="search"><span>⌕</span><input id="search-input" placeholder="搜索标题或正文" aria-label="搜索标题或正文"></label>
      <nav id="tree" aria-label="笔记列表"></nav>
      <p id="list-warning" class="warning" hidden></p>
      <footer class="sidebar-footer"><span class="dot"></span> 仅本地<span id="file-count"></span><button id="refresh" aria-label="刷新笔记" title="刷新">↻</button></footer>
    </aside>
    <main id="content">
      <header class="topbar"><button id="toggle-sidebar" aria-label="展开或收起侧边栏">☰</button><span id="breadcrumb">你的想法，从这里继续</span><span class="prototype-badge">本地原型</span></header>
      <div class="prototype-note">仅使用测试资料 · 助手、云同步、日程和手机容器尚未接入</div>
      <section id="home-view">
        <div class="intro"><span class="eyebrow">A LITTLE SPACE TO CONTINUE</span><h1>接住想法，<br>接着往前。</h1><p>先留下一句话，不必急着分类。<br>它会成为你自己的 Markdown 文件。</p></div>
        <div id="chat-container">
          <label for="chat-input" class="sr-only">随手记录</label>
          <textarea id="chat-input" placeholder="此刻想到什么？原型只保存原话，不会自动安排任务。" rows="4"></textarea>
          <div class="compose-footer"><span>保留原话 · 不调用 AI</span><button id="send-chat" class="primary">保存原话 <span>↑</span></button></div>
        </div>
        <p id="capture-status" class="status" role="status" aria-live="polite"></p>
        <div class="section-heading recent-heading"><h2>最近留下的</h2><span>保存后，随时可以继续编辑</span></div>
        <div id="chat"></div>
        <p id="empty-state" class="empty">还没有记录。这里不需要一个待清空的收件箱。</p>
      </section>
      <section id="note-view" hidden>
        <div class="note-heading"><button id="back-home" class="quiet">← 返回随手记</button><button id="save-note" class="primary">保存修改</button></div>
        <h1 id="note-title"></h1>
        <div class="note-meta"><span id="note-path"></span><span>Markdown 源文</span></div>
        <div id="editor-container"><label for="editor-textarea" class="sr-only">笔记正文</label><textarea id="editor-textarea" spellcheck="false"></textarea></div>
        <div class="note-bottom"><p id="save-status" class="status" role="status" aria-live="polite"></p><button id="reload-note" class="quiet">重新读取磁盘版本</button></div>
      </section>
      <footer class="main-footer"><span>内容保存在本机</span><code id="vault-path"></code></footer>
    </main>
  </div>
  <dialog id="new-dialog"><form id="new-form"><h2>新建一页</h2><p>文件名不跟随正文标题自动变化。</p><label for="new-path">相对路径</label><input id="new-path" value="新的笔记.md" maxlength="240" required><p id="new-error" class="warning" role="status"></p><div class="dialog-actions"><button id="cancel-new" type="button">取消</button><button type="submit" class="primary">创建笔记</button></div></form></dialog>
</body>
</html>
