- id: headless-runner
  disabled: true
# Like dsh-web-app: the agent-facing rows of the base profile are disabled so
# the tutor sees exactly the tools its preset mounts (what users get under `dsh web`).
- id: tool-plugin-manager
  disabled: true
# DeepSeek-only request extensions (session-log deltas, plugin inventory): the eval
# has no use for them, and other Messages endpoints reject the extra fields. The
# registry itself stays on: under --anthropic with LA_EVAL_PROMPT_CACHE=1 the driver contributes `cache_control`.
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
